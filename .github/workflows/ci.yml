name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guard:
    name: Version sentinel guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # version.generated.ts must stay at the 0.0.0-dev sentinel; real versions are stamped
      # only inside release builds (see release-please.yml / release-binaries.yml).
      - run: grep -q '"0.0.0-dev"' src/version.generated.ts || { echo "src/version.generated.ts must contain the 0.0.0-dev sentinel — run 'node scripts/write-version.ts --reset'"; exit 1; }

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run lint

  node:
    name: Node test (${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 22.18.0 is the engines minimum (first 22.x with flag-free node:sqlite + type stripping).
        node: ["22.18.0", "24"]
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  bun:
    name: Bun test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run test:bun
      # smoke the compiled standalone binary — the artifact users actually install
      - run: npm run test:e2e-binary
