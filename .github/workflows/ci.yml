name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: Node test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm install
      - run: npm run typecheck
      - run: npm test

  bun:
    name: Bun test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run test:bun
