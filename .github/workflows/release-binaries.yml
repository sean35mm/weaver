name: release-binaries

# Manual fallback: (re)build and attach standalone binaries for an existing release tag.
# The normal path builds binaries automatically in the release-please workflow; use this only
# to rebuild or to backfill a release made by hand.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)build binaries for (e.g. v0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - { name: weaver-darwin-arm64, bun: bun-darwin-arm64 }
          - { name: weaver-darwin-x64, bun: bun-darwin-x64 }
          - { name: weaver-linux-x64, bun: bun-linux-x64 }
          - { name: weaver-linux-arm64, bun: bun-linux-arm64 }
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: npm run build:dashboard
      - run: node scripts/write-version.ts
      - run: bun build src/cli.ts --compile --target=${{ matrix.target.bun }} --outfile ${{ matrix.target.name }}
      - run: sha256sum "${{ matrix.target.name }}" > "${{ matrix.target.name }}.sha256"
      - run: gh release upload "${{ inputs.tag }}" "${{ matrix.target.name }}" "${{ matrix.target.name }}.sha256" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
