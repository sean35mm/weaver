name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Configured via release-please-config.json + .release-please-manifest.json so that
      # bump-minor-pre-major keeps releases on 0.x: feat → minor, fix → patch, and a
      # BREAKING CHANGE bumps the minor instead of jumping to 1.0.0.
      - uses: googleapis/release-please-action@v4
        id: release

  # Build + attach standalone binaries in the SAME (push-triggered) run. This avoids the
  # GitHub limitation where a release created by GITHUB_TOKEN does not fire `release:published`.
  binaries:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        target:
          - { name: weaver-darwin-arm64, bun: bun-darwin-arm64 }
          - { name: weaver-darwin-x64, bun: bun-darwin-x64 }
          - { name: weaver-linux-x64, bun: bun-linux-x64 }
          - { name: weaver-linux-arm64, bun: bun-linux-arm64 }
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      # Stamp the real version (from package.json, just bumped by release-please) into the binary fallback.
      - run: node scripts/write-version.ts
      - run: bun build src/cli.ts --compile --target=${{ matrix.target.bun }} --outfile ${{ matrix.target.name }}
      - run: sha256sum "${{ matrix.target.name }}" > "${{ matrix.target.name }}.sha256"
      - run: gh release upload "${{ needs.release-please.outputs.tag_name }}" "${{ matrix.target.name }}" "${{ matrix.target.name }}.sha256" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
