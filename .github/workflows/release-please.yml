name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          release-type: node
          # Opens/maintains a "Release vX.Y.Z" PR from conventional commits.
          # Merging it tags the release and (with an npm publish step added later)
          # publishes to npm. Publishing is intentionally deferred until the npm
          # account/scope exists.
